id = "appboypov.quick-actions"
name = "Herdr Quick Actions"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Contextual quick actions menu for the active Herdr pane."
platforms = ["macos", "linux"]

[[actions]]
id = "open"
title = "Quick Actions"
contexts = ["workspace"]
command = ["bash", "bin/open-picker.sh"]

[[panes]]
id = "actions"
title = "Quick Actions"
placement = "popup"
width = "60%"
height = "50%"
command = ["bash", "bin/picker.sh"]
